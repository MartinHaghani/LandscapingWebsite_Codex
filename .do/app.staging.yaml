# DigitalOcean App Platform spec template for Autoscape staging.
# Replace every __SET_IN_DIGITALOCEAN__ value in the DigitalOcean UI or
# by editing a private copy of this spec before applying it with doctl.
name: autoscape-staging
region: tor
features:
  - buildpack-stack=ubuntu-22

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

databases:
  - name: autoscape-staging-db
    engine: PG
    version: "16"
    production: true
    cluster_name: autoscape-staging-db
    db_name: autoscape_staging
    db_user: autoscape_staging

static_sites:
  - name: public-web
    environment_slug: node-js
    github:
      repo: MartinHaghani/LandscapingWebsite_Codex
      branch: staging
      deploy_on_push: true
    source_dir: client
    build_command: npm ci && npm run build
    output_dir: dist
    index_document: index.html
    catchall_document: index.html
    envs:
      - key: VITE_API_BASE_URL
        value: https://api-staging.autoscape.ca
        scope: BUILD_TIME
        type: GENERAL
      - key: VITE_MAPBOX_TOKEN
        value: __SET_IN_DIGITALOCEAN__
        scope: BUILD_TIME
        type: SECRET
      - key: VITE_CLERK_PUBLISHABLE_KEY
        value: __SET_IN_DIGITALOCEAN__
        scope: BUILD_TIME
        type: SECRET
      - key: VITE_SYSTEM_LAUNCH_AT
        value: "2026-03-04T00:00:00.000Z"
        scope: BUILD_TIME
        type: GENERAL

  - name: admin-web
    environment_slug: node-js
    github:
      repo: MartinHaghani/LandscapingWebsite_Codex
      branch: staging
      deploy_on_push: true
    source_dir: admin
    build_command: npm ci && npm run build
    output_dir: dist
    index_document: index.html
    catchall_document: index.html
    envs:
      - key: VITE_API_BASE_URL
        value: https://api-staging.autoscape.ca
        scope: BUILD_TIME
        type: GENERAL
      - key: VITE_CLERK_PUBLISHABLE_KEY
        value: __SET_IN_DIGITALOCEAN__
        scope: BUILD_TIME
        type: SECRET
      - key: VITE_CLERK_ADMIN_ORG_ID
        value: __SET_IN_DIGITALOCEAN__
        scope: BUILD_TIME
        type: SECRET
      - key: VITE_SYSTEM_LAUNCH_AT
        value: "2026-03-04T00:00:00.000Z"
        scope: BUILD_TIME
        type: GENERAL

services:
  - name: api
    environment_slug: node-js
    github:
      repo: MartinHaghani/LandscapingWebsite_Codex
      branch: staging
      deploy_on_push: true
    source_dir: server
    build_command: npm ci && npm run prisma:generate && npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
        type: GENERAL
      - key: DATABASE_URL
        value: ${autoscape-staging-db.DATABASE_URL}
        scope: RUN_TIME
        type: GENERAL
      - key: CLIENT_ORIGIN
        value: https://staging.autoscape.ca,https://admin-staging.autoscape.ca
        scope: RUN_TIME
        type: GENERAL
      - key: PUBLIC_APP_BASE_URL
        value: https://staging.autoscape.ca
        scope: RUN_TIME
        type: GENERAL
      - key: PUBLIC_API_BASE_URL
        value: https://api-staging.autoscape.ca
        scope: RUN_TIME
        type: GENERAL
      - key: SERVICE_AREA_REGIONS
        value: Vaughan, Ontario
        scope: RUN_TIME
        type: GENERAL
      - key: AUTOSCAPE_BASE_STATIONS_JSON
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_SECRET_KEY
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_JWT_ISSUER
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_ADMIN_ORG_ID
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: SYSTEM_LAUNCH_AT
        value: "2026-03-04T00:00:00.000Z"
        scope: RUN_TIME
        type: GENERAL
      - key: RESEND_API_KEY
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: APPROVED_QUOTE_EMAIL_FROM
        value: Autoscape <contact@autoscape.ca>
        scope: RUN_TIME
        type: GENERAL
      - key: APPROVED_QUOTE_EMAIL_REPLY_TO
        value: contact@autoscape.ca
        scope: RUN_TIME
        type: GENERAL
      - key: MAPBOX_STATIC_ACCESS_TOKEN
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_SECRET_KEY
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_ADS_CLIENT_ID
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_ADS_CLIENT_SECRET
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_ADS_REFRESH_TOKEN
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_ADS_CUSTOMER_ID
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET

jobs:
  - name: migrate
    environment_slug: node-js
    github:
      repo: MartinHaghani/LandscapingWebsite_Codex
      branch: staging
      deploy_on_push: true
    source_dir: server
    build_command: npm ci && npm run prisma:generate && npm run build
    run_command: npm run prisma:migrate:deploy
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    kind: PRE_DEPLOY
    envs:
      - key: DATABASE_URL
        value: ${autoscape-staging-db.DATABASE_URL}
        scope: RUN_TIME
        type: GENERAL

  - name: google-ads-spend-import
    environment_slug: node-js
    github:
      repo: MartinHaghani/LandscapingWebsite_Codex
      branch: staging
      deploy_on_push: true
    source_dir: server
    build_command: npm ci && npm run prisma:generate && npm run build
    run_command: npm run ads:import-google -- --days=30
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    kind: SCHEDULED
    schedule:
      cron: "15 6 * * *"
      time_zone: America/Toronto
    envs:
      - key: DATABASE_URL
        value: ${autoscape-staging-db.DATABASE_URL}
        scope: RUN_TIME
        type: GENERAL
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_ADS_CLIENT_ID
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_ADS_CLIENT_SECRET
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_ADS_REFRESH_TOKEN
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_ADS_CUSTOMER_ID
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        value: __SET_IN_DIGITALOCEAN__
        scope: RUN_TIME
        type: SECRET

domains:
  - domain: staging.autoscape.ca
    type: PRIMARY
    minimum_tls_version: "1.2"
  - domain: api-staging.autoscape.ca
    type: ALIAS
    minimum_tls_version: "1.2"
  - domain: admin-staging.autoscape.ca
    type: ALIAS
    minimum_tls_version: "1.2"

ingress:
  rules:
    - match:
        authority:
          exact: api-staging.autoscape.ca
        path:
          prefix: /
      component:
        name: api
        preserve_path_prefix: true
    - match:
        authority:
          exact: admin-staging.autoscape.ca
        path:
          prefix: /
      component:
        name: admin-web
    - match:
        authority:
          exact: staging.autoscape.ca
        path:
          prefix: /
      component:
        name: public-web
    - match:
        path:
          prefix: /
      component:
        name: public-web
